name: Discord Notification

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, closed, reopened]
  issues:
    types: [opened, closed, reopened]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send to Discord
        uses: sarisia/actions-status-discord@v1
        if: always()
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          title: "Обновление"
          description: |
            **Событие:** `${{ github.event_name }}`
            **Автор:** `${{ github.actor }}`
            **Ссылка:** ${{ github.event.head_commit.url || github.event.pull_request.html_url || github.event.issue.html_url }}
          color: 0x7289da
