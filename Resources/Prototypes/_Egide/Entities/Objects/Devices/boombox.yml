- type: entity
  parent: BaseItem
  id: EgideBoomBox
  name: boombox
  description: Music speaker, portable jukebox.
  suffix: Egide
  components:
  - type: Sprite
    sprite: _Orion/Objects/Devices/boombox.rsi
    layers:
    - state: "off"
      map: ["enum.JukeboxVisualLayers.Base"]
  - type: TapePlayer
  - type: Item
    sprite: _Orion/Objects/Devices/boombox.rsi
    size: Large
    shape:
    - 0,0,3,2
  - type: Appearance
  - type: ActivatableUI
    key: enum.TapePlayerUiKey.Key
    inHandsOnly: false
    requireActiveHand: false
  - type: UserInterface
    interfaces:
      enum.TapePlayerUiKey.Key:
        type: TapePlayerBoundUserInterface
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 250
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 3
