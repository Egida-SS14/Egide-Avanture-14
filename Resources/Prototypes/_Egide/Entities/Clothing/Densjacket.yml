- type: entity
  parent: [ ClothingOuterStorageBase, AllowSuitStorageClothing ]
  id: ClothingOuterCoatDensJacket
  name: Den's jacket
  description: an old bomber jacket equipped with an engineer's life support system and additional temperature and radiation sensors. a strange decision.
  components:
  - type: Sprite
    sprite: _Egide/Clothing/OuterClothing/Coats/Densjacket.rsi
  - type: Clothing
    sprite: _Egide/Clothing/OuterClothing/Coats/Densjacket.rsi
    clothingVisuals:
      outerClothing:
      - state: equipped-OUTERCLOTHING
      - state: equipped-OUTERCLOTHING-unshaded
        shader: unshaded
  - type: Storage
    grid:
    - 0,0,2,2
  - type: Geiger
    attachedToSuit: true
  - type: Armor
    coverage:
    - Chest
    - Groin
    traumaDeductions:
      Dismemberment: 0.2
      OrganDamage: 0.2
      BoneDamage: 0.2
      VeinsDamage: 0
      NerveDamage: 0
    modifiers:
      coefficients:
        Asphyxiation: 0.9
        Heat: 0.85
        Radiation: 0.9
        Blunt: 0.55
        Slash: 0.55
        Piercing: 0.55
  - type: ExplosionResistance
    damageCoefficient: 0.9
  - type: ModifyDelayedKnockdown # Goobstation
    delayDelta: 2
    knockdownTimeDelta: -2
  - type: StaminaResistance # Goobstation
    damageCoefficient: 0.7
